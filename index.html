  .btn-170 {
    --icon_size: 25px;

    overflow: hidden;

    background: radial-gradient(circle at center center, #d9ff96, #b4e692, #86ce73, #57b653, #299e33);

    padding: 15px 15px;
    position: relative;

    justify-content: center;
    align-items: center;
    font-size: 16px;
    font-weight: bold;
    gap: 10px;
    transition: all 350ms ease-out;
    /*** full width block ***/
    /* width: 100%; */
}

.btn-170 span {
    display: block;
    position: relative;
    margin-left: 35px;
    z-index: 1;
}

.btn-170 svg {
    z-index: 0;
    fill: var(--icon_color);
    left: 25px;
    top: 50%;
    transform: translate(-50%, -50%) rotate(0deg);
    transition: all 350ms ease-out;
    width: var(--icon_size);
    height: var(--icon_size);
    position: absolute;
}

.btn-170:hover {
    color: #000000;
}

.btn-170:hover svg {
    transform: translate(-50%, -50%) rotate(360deg);
    fill: rgb(0, 0, 0);
}

/*** disabled style ***/
.btn-170:disabled {
    pointer-events: none;
    opacity: .65;
    color: #7e7e7e;
    background: #dcdcdc;
    box-shadow: none;
    text-shadow: none;
    --icon_color: #7e7e7e;
      }
